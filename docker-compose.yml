version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: iso_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: unelsis_iso_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
